<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI Photo Extractor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { color: #38bdf8; margin-top: 10px; font-size: 1.8rem; }
    p.subtitle { color: #94a3b8; margin-bottom: 20px; text-align: center; }
    .input-box { margin-bottom: 15px; width: 100%; max-width: 400px; text-align: left; }
    .input-box label { font-size: 12px; color: #38bdf8; display: block; margin-bottom: 5px; }
    .input-box input {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155;
      background: #1e293b; color: white; outline: none;
    }
    .upload-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white; padding: 12px 24px; font-size: 16px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    #status { margin: 20px 0; font-size: 14px; color: #38bdf8; font-weight: 600; }
    .grid-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px; width: 100%; max-width: 1200px; margin-top: 10px;
    }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px;
      display: flex; flex-direction: column; align-items: center;
    }
    .img-wrapper { width: 100%; background: #0f172a; border-radius: 8px; overflow: hidden; }
    .card img { width: 100%; height: auto; display: block; }
    .download-btn {
      margin-top: 10px; color: #ffffff; background: #0284c7; text-decoration: none;
      padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; align-self: flex-end;
    }
  </style>
</head>
<body>

  <h1>Smart AI Photo Extractor</h1>
  <p class="subtitle">Extracts ONLY the main property photo from screenshots</p>

  <div class="input-box">
    <label>Enter Gemini API Key:</label>
    <input type="password" id="apiKey" placeholder="AI Studio Key yahan daalein">
  </div>

  <input type="file" id="upload" accept="image/*" multiple style="display: none;">
  <button class="upload-btn" onclick="checkAndUpload()">Select Images</button>

  <p id="status">API Key daal kar images select karein.</p>

  <div class="grid-container" id="resultsGrid"></div>

  <script>
    function checkAndUpload() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) {
        alert("Kripya pehle apni Gemini API Key daalein!");
        return;
      }
      document.getElementById('upload').click();
    }

    document.getElementById('upload').addEventListener('change', async (e) => {
      const files = e.target.files;
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!files || files.length === 0) return;

      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = ""; 

      for (let i = 0; i < files.length; i++) {
        document.getElementById('status').innerText = `AI Processing image ${i + 1} of ${files.length}...`;
        await processWithGemini(files[i], apiKey, i + 1);
      }

      document.getElementById('status').innerText = `Saari ${files.length} images crop ho gayi hain!`;
    });

    async function processWithGemini(file, apiKey, index) {
      const base64Data = await fileToBase64(file);
      
      const promptText = "Detect the main interior/property room photograph inside this screenshot. Ignore all UI elements, status bar, header, ads, floating PIP videos, text below, WhatsApp buttons, and surrounding white spaces. Output 4 integer coordinates [ymin, xmin, ymax, xmax] normalized on a scale from 0 to 1000.";

      const payload = {
        contents: [{
          parts: [
            { text: promptText },
            { inline_data: { mime_type: file.type || 'image/jpeg', data: base64Data.split(',')[1] } }
          ]
        }],
        generationConfig: {
          response_mime_type: "application/json",
          response_schema: {
            type: "ARRAY",
            items: { type: "INTEGER" },
            description: "Bounding box coordinates [ymin, xmin, ymax, xmax] from 0 to 1000"
          }
        }
      };

      try {
        // Using gemini-2.0-flash endpoint
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || "API Error");
        }

        const data = await response.json();
        const rawJsonText = data.candidates[0].content.parts[0].text;
        const coords = JSON.parse(rawJsonText);

        cropImageWithCanvas(file, coords, index);
      } catch (err) {
        console.error(err);
        alert(`Error image ${index}: ` + err.message);
      }
    }

    function cropImageWithCanvas(file, coords, index) {
      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = () => {
        const w = img.width;
        const h = img.height;

        // Coordinates scale: 0 to 1000
        const ymin = Math.max(0, Math.floor((coords[0] / 1000) * h));
        const xmin = Math.max(0, Math.floor((coords[1] / 1000) * w));
        const ymax = Math.min(h, Math.ceil((coords[2] / 1000) * h));
        const xmax = Math.min(w, Math.ceil((coords[3] / 1000) * w));

        const cropW = xmax - xmin;
        const cropH = ymax - ymin;

        const canvas = document.createElement('canvas');
        canvas.width = cropW;
        canvas.height = cropH;
        const ctx = canvas.getContext('2d');

        ctx.drawImage(img, xmin, ymin, cropW, cropH, 0, 0, cropW, cropH);
        const croppedUrl = canvas.toDataURL('image/jpeg', 0.95);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="img-wrapper"><img src="${croppedUrl}"></div>
          <a href="${croppedUrl}" download="cropped_${index}.jpg" class="download-btn">Download</a>
        `;
        document.getElementById('resultsGrid').appendChild(card);
      };
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
