<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Image Cropper</title>
  
  <!-- TensorFlow.js and COCO-SSD Model CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tfjs-models/coco-ssd"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin-top: 10px;
      font-size: 2rem;
      color: #38bdf8;
    }
    p.subtitle {
      color: #94a3b8;
      margin-bottom: 25px;
      text-align: center;
    }
    .upload-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease-in-out;
    }
    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
    }
    #status {
      margin: 20px 0;
      font-size: 15px;
      font-weight: 500;
      color: #38bdf8;
      text-align: center;
    }

    /* Grid Layout for Cropped Output Boxes */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      margin-top: 10px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
    }
    .img-wrapper {
      width: 100%;
      height: 240px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      border-radius: 8px;
      overflow: hidden;
    }
    .card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .card-footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    .tag {
      font-size: 12px;
      background: #334155;
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
    }
    .download-btn {
      color: #f8fafc;
      background: #0284c7;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .download-btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <h1>Auto Image Cropper</h1>
  <p class="subtitle">Ek saath multiple images upload karein, AI automatically background hata kar crop kar dega</p>

  <!-- Multiple Files Select Input -->
  <input type="file" id="upload" accept="image/*" multiple style="display: none;">
  <button class="upload-btn" onclick="document.getElementById('upload').click()">Select Images</button>

  <p id="status">AI Model load ho raha hai, kripya thoda intezar karein...</p>

  <!-- Output Cards Grid -->
  <div class="grid-container" id="resultsGrid"></div>

  <script>
    let model;

    // AI Model Initialization
    async function loadModel() {
      model = await cocoSsd.load();
      document.getElementById('status').innerText = "AI Model ready hai! Ab photos select karein.";
    }
    loadModel();

    // Handling Image Uploads
    document.getElementById('upload').addEventListener('change', async (e) => {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = ""; // Clear previous outputs

      for (let i = 0; i < files.length; i++) {
        document.getElementById('status').innerText = `Processing image ${i + 1} of ${files.length}...`;
        await processSingleImage(files[i], i + 1);
      }

      document.getElementById('status').innerText = `Completed! Saari ${files.length} images crop ho chuki hain.`;
    });

    // Image Detection and Auto-Crop Logic
    function processSingleImage(file, index) {
      return new Promise((resolve) => {
        const reader = new FileReader();

        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;

          img.onload = async () => {
            // Run Detection
            const predictions = await model.detect(img);

            let cropX = 0, cropY = 0, cropW = img.width, cropH = img.height;
            let label = "Full Image";

            if (predictions.length > 0) {
              // Find the largest object in the photo
              let mainObject = predictions[0];
              predictions.forEach(p => {
                if ((p.bbox[2] * p.bbox[3]) > (mainObject.bbox[2] * mainObject.bbox[3])) {
                  mainObject = p;
                }
              });

              [cropX, cropY, cropW, cropH] = mainObject.bbox;
              label = mainObject.class;
            }

            // Canvas Crop Action
            const canvas = document.createElement('canvas');
            canvas.width = cropW;
            canvas.height = cropH;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
            const croppedDataUrl = canvas.toDataURL('image/jpeg');

            // Render Card Item
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <div class="img-wrapper">
                <img src="${croppedDataUrl}" alt="Cropped Output">
              </div>
              <div class="card-footer">
                <span class="tag">${label}</span>
                <a href="${croppedDataUrl}" download="cropped_${index}.jpg" class="download-btn">Download</a>
              </div>
            `;

            document.getElementById('resultsGrid').appendChild(card);
            resolve();
          };
        };

        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
