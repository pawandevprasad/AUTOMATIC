<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Auto Cropper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { margin-top: 10px; font-size: 2rem; color: #38bdf8; }
    p.subtitle { color: #94a3b8; margin-bottom: 25px; text-align: center; }
    .upload-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    #status { margin: 20px 0; font-size: 15px; color: #38bdf8; font-weight: 600; }
    
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      margin-top: 10px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .img-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      border-radius: 8px;
      overflow: hidden;
      padding: 5px;
    }
    .card img {
      max-width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 4px;
    }
    .card-footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    .tag { font-size: 12px; background: #334155; color: #38bdf8; padding: 4px 10px; border-radius: 12px; }
    .download-btn { color: #ffffff; background: #0284c7; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>

  <h1>Auto Image Cropper</h1>
  <p class="subtitle">Automatic White & Black Margin Removal</p>

  <input type="file" id="upload" accept="image/*" multiple style="display: none;">
  <button class="upload-btn" onclick="document.getElementById('upload').click()">Select Images</button>

  <p id="status">Ready! Photos select karein.</p>

  <div class="grid-container" id="resultsGrid"></div>

  <script>
    document.getElementById('upload').addEventListener('change', (e) => {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = ""; 

      document.getElementById('status').innerText = `Processing ${files.length} images...`;

      Array.from(files).forEach((file, index) => {
        smartMarginCrop(file, index + 1);
      });
    });

    function smartMarginCrop(file, index) {
      const reader = new FileReader();

      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;

        img.onload = () => {
          const w = img.width;
          const h = img.height;

          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = w;
          tempCanvas.height = h;
          const tempCtx = tempCanvas.getContext('2d');
          tempCtx.drawImage(img, 0, 0);

          const imageData = tempCtx.getImageData(0, 0, w, h);
          const data = imageData.data;

          let top = h, bottom = 0, left = w, right = 0;

          // Scanning pixels to remove surrounding white/black spaces
          for (let y = 0; y < h; y += 3) {
            for (let x = 0; x < w; x += 3) {
              const i = (y * w + x) * 4;
              const r = data[i], g = data[i+1], b = data[i+2];

              // Check if pixel is NOT pure white/near-white and NOT dark UI bar
              const isWhiteMargin = (r > 235 && g > 235 && b > 235);
              const isDarkHeader = (y < h * 0.08) && (r < 40 && g < 40 && b < 40);

              if (!isWhiteMargin && !isDarkHeader) {
                if (x < left) left = x;
                if (x > right) right = x;
                if (y < top) top = y;
                if (y > bottom) bottom = y;
              }
            }
          }

          // Safety bounds check
          if (left >= right || top >= bottom) {
            left = 0; right = w; top = Math.floor(h * 0.1); bottom = Math.floor(h * 0.85);
          }

          const cropW = right - left;
          const cropH = bottom - top;

          // Draw Cropped Image
          const canvas = document.createElement('canvas');
          canvas.width = cropW;
          canvas.height = cropH;
          const ctx = canvas.getContext('2d');

          ctx.drawImage(img, left, top, cropW, cropH, 0, 0, cropW, cropH);
          const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.92);

          // Append to UI
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="img-wrapper">
              <img src="${croppedDataUrl}" alt="Cropped Output">
            </div>
            <div class="card-footer">
              <span class="tag">Background Removed</span>
              <a href="${croppedDataUrl}" download="cropped_${index}.jpg" class="download-btn">Download</a>
            </div>
          `;

          document.getElementById('resultsGrid').appendChild(card);
          document.getElementById('status').innerText = "Processing Complete!";
        };
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
