<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Pipeline: Gemini Direct Auto-Crop & S3 Upload</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { color: #38bdf8; margin-top: 10px; font-size: 1.8rem; }
    p.subtitle { color: #94a3b8; margin-bottom: 25px; text-align: center; }

    .step-container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 1200px;
      margin-bottom: 20px;
    }
    .step-title {
      font-size: 16px;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .key-input-box {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #38bdf8;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
      outline: none;
    }

    .upload-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white; padding: 12px 24px; font-size: 15px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }

    #status { margin: 15px 0; font-size: 14px; color: #38bdf8; font-weight: 600; text-align: center; }

    .grid-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px; width: 100%; margin-top: 10px;
    }
    .card {
      background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .img-wrapper {
      width: 100%; height: 260px; background: #1e293b; border-radius: 6px;
      overflow: hidden; display: flex; justify-content: center; align-items: center;
    }
    .card img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
    .loading-spinner { color: #94a3b8; font-size: 12px; font-style: italic; text-align: center; padding: 8px; }

    .url-box { width: 100%; display: flex; gap: 5px; align-items: center; }
    .url-input {
      flex: 1; padding: 6px; background: #0f172a; border: 1px solid #334155;
      color: #38bdf8; border-radius: 4px; font-size: 11px; outline: none;
    }
    .copy-btn {
      background: #0284c7; color: white; border: none; padding: 6px 10px;
      border-radius: 4px; cursor: pointer; font-size: 11px; white-space: nowrap;
    }
    .copy-btn.copied { background: #10b981; }

    .action-bar {
      margin-top: 15px; display: flex; flex-direction: column; gap: 10px; width: 100%;
    }
    .select-all-btn {
      background: #10b981; color: white; padding: 12px 20px; font-size: 15px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer; width: 100%;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .all-urls-text {
      width: 100%; background: #0f172a; border: 1px solid #334155;
      color: #38bdf8; padding: 12px; border-radius: 8px; font-size: 12px;
      font-family: 'Courier New', Courier, monospace; outline: none; resize: vertical;
    }
  </style>
</head>
<body>

  <h1>Property S3 Pipeline & Direct Gemini Auto-Cropper</h1>
  <p class="subtitle">Auto-crop images using Gemini Vision Bounding Box, and Upload to S3</p>

  <div class="step-container">
    <div class="step-title">Gemini API Key Config</div>
    <input type="password" id="geminiApiKey" class="key-input-box" placeholder="Gemini API Key Yahan Dalein (ya Server Env Var Auto-detect hoga)" value="{{ gemini_key }}">
    
    <div class="step-title">Select Screenshots to Auto-Crop & Upload to S3</div>
    <input type="file" id="propImages" accept="image/*" multiple style="display: none;">
    <button class="upload-btn" onclick="document.getElementById('propImages').click()">Choose Screenshots</button>

    <div class="grid-container" id="resultsGrid"></div>

    <div class="action-bar" id="actionBar" style="display: none;">
      <button class="select-all-btn" id="selectAllBtn" onclick="copyAllURLs()">✓ Copy All Serial S3 URLs</button>
      <textarea id="allUrlsBox" class="all-urls-text" rows="4" readonly></textarea>
    </div>
  </div>

  <p id="status">Pehle Property Photos Choose Karein.</p>

  <script>
    let globalS3Urls = [];

    document.getElementById('propImages').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files || files.length === 0) return;

      const apiKey = document.getElementById('geminiApiKey').value.trim();
      if (!apiKey) {
        alert("Kripya Gemini API Key enter karein!");
        return;
      }

      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = "";
      globalS3Urls = [];
      document.getElementById('allUrlsBox').value = "";
      document.getElementById('actionBar').style.display = "none";

      document.getElementById('status').innerText = `${files.length} Screenshots auto-crop aur upload ho rahe hain...`;

      files.forEach((file, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card_${index}`;
        card.innerHTML = `
          <div class="img-wrapper">
            <span class="loading-spinner" id="spinner_${index}">Cropping Photo #${index + 1}...</span>
            <img id="img_${index}" style="display:none;">
          </div>
          <div class="url-box" id="urlBox_${index}" style="display:none;">
            <input type="text" class="url-input" id="urlInput_${index}" readonly>
            <button class="copy-btn" onclick="copySingleURL('urlInput_${index}', this)">Copy</button>
          </div>
        `;
        grid.appendChild(card);
      });

      for (let i = 0; i < files.length; i++) {
        document.getElementById('status').innerText = `Processing screenshot ${i + 1} of ${files.length}...`;
        
        try {
          // 1. Direct Client-side call to Gemini Vision API for Bounding Box
          const coords = await getGeminiCropBox(files[i], apiKey);

          // 2. Exact Room Crop using HTML5 Canvas
          const croppedBlob = await cropImageCanvas(files[i], coords);

          // 3. Upload Cropped Image to S3 via Backend API
          const s3FormData = new FormData();
          s3FormData.append('image', croppedBlob);

          const uploadRes = await fetch('/api/upload-s3-single', { method: 'POST', body: s3FormData });
          const uploadData = await uploadRes.json();

          if (uploadData.success) {
            document.getElementById(`spinner_${i}`).style.display = 'none';
            
            const imgElem = document.getElementById(`img_${i}`);
            imgElem.src = uploadData.url;
            imgElem.style.display = 'block';

            const urlInput = document.getElementById(`urlInput_${i}`);
            urlInput.value = uploadData.url;
            document.getElementById(`urlBox_${i}`).style.display = 'flex';

            globalS3Urls.push(uploadData.url);
            document.getElementById('allUrlsBox').value = globalS3Urls.join('\n');
          } else {
            document.getElementById(`spinner_${i}`).innerText = uploadData.error || `S3 Error #${i + 1}`;
          }
        } catch (err) {
          console.error(err);
          document.getElementById(`spinner_${i}`).innerText = `Crop Failed: ${err.message}`;
        }
      }

      document.getElementById('status').innerText = `Sabhi ${files.length} photos perfectly crop ho kar S3 par upload ho gayi hain!`;
      document.getElementById('actionBar').style.display = "flex";
    });

    // Safe multi-model fallback handler to prevent JSON crash
    async function getGeminiCropBox(file, apiKey) {
      const base64Str = await fileToBase64(file);
      
      const promptText = "Detect the bounding box of ONLY the main interior room or property photograph inside this screenshot. Ignore top status bar, header bar, floating video overlays, WhatsApp/call buttons, and large white spaces. Return EXACTLY four normalized integer coordinates in square brackets like [ymin, xmin, ymax, xmax] from 0 to 1000.";

      const payload = {
        "contents": [{
          "parts": [
            { "text": promptText },
            { "inline_data": { "mime_type": "image/jpeg", "data": base64Str } }
          ]
        }]
      };

      const models = [
        "gemini-2.5-flash",
        "gemini-1.5-flash",
        "gemini-1.5-pro"
      ];

      for (let model of models) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!res.ok) continue;

          const textRes = await res.text();
          if (!textRes) continue;

          const resData = JSON.parse(textRes);
          if (!resData.candidates || !resData.candidates[0]) continue;

          const rawText = resData.candidates[0].content.parts[0].text;
          const match = rawText.match(/\[\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\]/);
          
          if (match) {
            return [parseInt(match[1]), parseInt(match[2]), parseInt(match[3]), parseInt(match[4])];
          } else {
            const nums = rawText.match(/\d+/g);
            if (nums && nums.length >= 4) {
              return nums.slice(0, 4).map(n => parseInt(n));
            }
          }
        } catch (e) {
          console.warn(`Model ${model} failed, trying next...`, e);
        }
      }

      // Default safe crop box if API fails
      return [300, 0, 800, 1000];
    }

    // Canvas Crop using Bounding Box Coordinates
    function cropImageCanvas(file, coords) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
          const w = img.width, h = img.height;

          const ymin = Math.max(0, Math.floor((coords[0] / 1000) * h));
          const xmin = Math.max(0, Math.floor((coords[1] / 1000) * w));
          const ymax = Math.min(h, Math.ceil((coords[2] / 1000) * h));
          const xmax = Math.min(w, Math.ceil((coords[3] / 1000) * w));

          const cropW = xmax - xmin;
          const cropH = ymax - ymin;

          const canvas = document.createElement('canvas');
          canvas.width = cropW;
          canvas.height = cropH;
          const ctx = canvas.getContext('2d');

          ctx.drawImage(img, xmin, ymin, cropW, cropH, 0, 0, cropW, cropH);

          canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.95);
        };
      });
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    function silentCopy(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      } else {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        return new Promise((resolve, reject) => {
          document.execCommand('copy') ? resolve() : reject();
          textArea.remove();
        });
      }
    }

    function copySingleURL(inputId, btn) {
      const val = document.getElementById(inputId).value;
      silentCopy(val).then(() => {
        btn.innerText = "Copied!";
        btn.classList.add("copied");
        setTimeout(() => { btn.innerText = "Copy"; btn.classList.remove("copied"); }, 2000);
      });
    }

    function copyAllURLs() {
      const txt = document.getElementById('allUrlsBox');
      const btn = document.getElementById('selectAllBtn');
      txt.select();
      silentCopy(txt.value).then(() => {
        btn.innerText = "✓ All Serial S3 URLs Copied!";
        setTimeout(() => { btn.innerText = "✓ Copy All Serial S3 URLs"; }, 2500);
      });
    }
  </script>
</body>
</html>
