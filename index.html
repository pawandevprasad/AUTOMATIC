<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Crop & S3 Cloud Uploader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { color: #38bdf8; margin-top: 10px; font-size: 1.8rem; }
    p.subtitle { color: #94a3b8; margin-bottom: 25px; text-align: center; }

    .upload-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white; padding: 14px 28px; font-size: 16px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    #status { margin: 20px 0; font-size: 15px; color: #38bdf8; font-weight: 600; }

    .grid-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px; width: 100%; max-width: 1200px; margin-top: 10px;
    }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .img-wrapper {
      width: 100%; height: 200px; background: #0f172a; border-radius: 8px;
      overflow: hidden; display: flex; justify-content: center; align-items: center;
    }
    .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
    
    .loading-spinner {
      color: #94a3b8; font-size: 13px; font-style: italic;
    }

    .url-box { width: 100%; display: flex; gap: 5px; align-items: center; }
    .url-input {
      flex: 1; padding: 8px; background: #0f172a; border: 1px solid #334155;
      color: #38bdf8; border-radius: 4px; font-size: 11px; outline: none;
    }
    .copy-btn {
      background: #0284c7; color: white; border: none; padding: 8px 12px;
      border-radius: 4px; cursor: pointer; font-size: 11px; white-space: nowrap;
    }

    .action-bar {
      margin-top: 25px; display: none; flex-direction: column; align-items: center;
      gap: 10px; width: 100%; max-width: 600px;
    }
    .select-all-btn {
      background: #10b981; color: white; padding: 14px 24px; font-size: 16px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer; width: 100%;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .all-urls-text {
      width: 100%; height: 120px; background: #1e293b; border: 1px solid #334155;
      color: #38bdf8; padding: 10px; border-radius: 8px; font-size: 12px; resize: none; outline: none;
    }
  </style>
</head>
<body>

  <h1>Smart Auto Cropper & S3 Uploader</h1>
  <p class="subtitle">Automatic cropping with S3 Cloud Storage Integration</p>

  <input type="file" id="upload" accept="image/*" multiple style="display: none;">
  <button class="upload-btn" onclick="document.getElementById('upload').click()">Select Images</button>

  <p id="status">Photos select karein.</p>

  <div class="grid-container" id="resultsGrid"></div>

  <div class="action-bar" id="actionBar">
    <button class="select-all-btn" onclick="copyAllURLs()">Select & Copy All URLs</button>
    <textarea id="allUrlsBox" class="all-urls-text" readonly placeholder="All S3 URLs will appear here in exact serial order..."></textarea>
  </div>

  <script>
    document.getElementById('upload').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files || files.length === 0) return;

      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = ""; 
      document.getElementById('allUrlsBox').value = "";
      document.getElementById('actionBar').style.display = "none";

      document.getElementById('status').innerText = `Processing ${files.length} images...`;

      // Step 1: Pre-create serial boxes to maintain exact order
      const cards = [];
      files.forEach((file, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card_${index}`;
        card.innerHTML = `
          <div class="img-wrapper">
            <span class="loading-spinner" id="spinner_${index}">Processing #${index + 1}...</span>
            <img id="img_${index}" style="display:none;">
          </div>
          <div class="url-box" id="urlBox_${index}" style="display:none;">
            <input type="text" class="url-input" id="urlInput_${index}" readonly>
            <button class="copy-btn" onclick="copySingleURL('urlInput_${index}', this)">Copy</button>
          </div>
        `;
        grid.appendChild(card);
        cards.push(card);
      });

      // Step 2: Strictly Process Images in Serial Sequential Order
      const uploadedUrls = [];

      for (let i = 0; i < files.length; i++) {
        document.getElementById('status').innerText = `Processing image ${i + 1} of ${files.length}...`;
        
        try {
          const formData = new FormData();
          formData.append('image', files[i]);

          const response = await fetch('/process-image', {
            method: 'POST',
            body: formData
          });

          const data = await response.json();

          if (data.success) {
            document.getElementById(`spinner_${i}`).style.display = 'none';
            
            const imgElem = document.getElementById(`img_${i}`);
            imgElem.src = data.url;
            imgElem.style.display = 'block';

            const urlInput = document.getElementById(`urlInput_${i}`);
            urlInput.value = data.url;
            document.getElementById(`urlBox_${i}`).style.display = 'flex';

            uploadedUrls.push(data.url);
            document.getElementById('allUrlsBox').value = uploadedUrls.join('\n');
          } else {
            document.getElementById(`spinner_${i}`).innerText = `Error processing image #${i + 1}`;
          }
        } catch (err) {
          console.error(err);
          document.getElementById(`spinner_${i}`).innerText = `Failed to process #${i + 1}`;
        }
      }

      document.getElementById('status').innerText = `Saari ${files.length} images process aur S3 par upload ho chuki hain!`;
      document.getElementById('actionBar').style.display = "flex";
    });

    function copySingleURL(inputId, btnElement) {
      const input = document.getElementById(inputId);
      navigator.clipboard.writeText(input.value);
      btnElement.innerText = "Copied!";
      setTimeout(() => { btnElement.innerText = "Copy"; }, 2000);
    }

    function copyAllURLs() {
      const allUrlsText = document.getElementById('allUrlsBox');
      allUrlsText.select();
      navigator.clipboard.writeText(allUrlsText.value);
      alert("Saare Serial URLs copy ho gaye hain!");
    }
  </script>
</body>
</html>
