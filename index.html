<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Fast Auto Cropper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin-top: 10px;
      font-size: 2rem;
      color: #38bdf8;
    }
    p.subtitle {
      color: #94a3b8;
      margin-bottom: 25px;
      text-align: center;
    }
    .upload-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease-in-out;
    }
    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
    }
    #status {
      margin: 20px 0;
      font-size: 15px;
      font-weight: 500;
      color: #38bdf8;
      text-align: center;
    }

    /* Grid Layout */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      margin-top: 10px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    .img-wrapper {
      width: 100%;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      border-radius: 8px;
      overflow: hidden;
    }
    .card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .card-footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    .tag {
      font-size: 12px;
      background: #334155;
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
    }
    .download-btn {
      color: #f8fafc;
      background: #0284c7;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <h1>Auto Image Cropper</h1>
  <p class="subtitle">Instant Auto-Cropping (Top UI & Bottom Ads Removal)</p>

  <input type="file" id="upload" accept="image/*" multiple style="display: none;">
  <button class="upload-btn" onclick="document.getElementById('upload').click()">Select Images</button>

  <p id="status">Ready! Photos select karein.</p>

  <div class="grid-container" id="resultsGrid"></div>

  <script>
    document.getElementById('upload').addEventListener('change', (e) => {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = ""; // Purana data saaf karein

      document.getElementById('status').innerText = `Processing ${files.length} images...`;

      // Parallel Processing for Maximum Speed
      Array.from(files).forEach((file, index) => {
        fastCropImage(file, index + 1);
      });

      document.getElementById('status').innerText = `Saari ${files.length} images instantly crop ho chuki hain!`;
    });

    function fastCropImage(file, index) {
      const reader = new FileReader();

      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;

        img.onload = () => {
          const w = img.width;
          const h = img.height;

          // Mobile Screenshot UI Removal Logic (Super Fast)
          // Top Status Bar (approx 7%) & Bottom UI/Ads (approx 22%) remove
          const cropX = 0;
          const cropY = Math.floor(h * 0.07);
          const cropW = w;
          const cropH = Math.floor(h * 0.71);

          // Fast Canvas Rendering
          const canvas = document.createElement('canvas');
          canvas.width = cropW;
          canvas.height = cropH;
          const ctx = canvas.getContext('2d');

          ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
          const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.9);

          // Render Card Item
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="img-wrapper">
              <img src="${croppedDataUrl}" alt="Cropped Output">
            </div>
            <div class="card-footer">
              <span class="tag">Auto Cropped</span>
              <a href="${croppedDataUrl}" download="cropped_${index}.jpg" class="download-btn">Download</a>
            </div>
          `;

          document.getElementById('resultsGrid').appendChild(card);
        };
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
