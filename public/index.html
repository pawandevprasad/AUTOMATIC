<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI Photo Extractor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { color: #38bdf8; margin-top: 10px; font-size: 1.8rem; }
    p.subtitle { color: #94a3b8; margin-bottom: 20px; text-align: center; }

    .upload-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white; padding: 12px 24px; font-size: 16px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      margin-top: 10px;
    }
    .upload-btn:hover { opacity: 0.95; }

    #status { margin: 20px 0 10px 0; font-size: 14px; color: #38bdf8; font-weight: 600; text-align: center; }

    /* Copy All URLs Panel */
    .global-actions {
      width: 100%; max-width: 1200px; margin-bottom: 20px; display: none; flex-direction: column; gap: 10px;
    }
    .copy-all-btn {
      background: #10b981; color: white; border: none; padding: 10px 18px; border-radius: 6px;
      font-size: 14px; font-weight: 600; cursor: pointer; align-self: flex-start;
    }
    .copy-all-btn:hover { background: #059669; }

    .grid-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px; width: 100%; max-width: 1200px; margin-top: 10px;
    }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .img-wrapper { 
      width: 100%; 
      background: transparent; 
      border-radius: 8px; 
      overflow: hidden; 
    }
    .card img { 
      width: 100%; 
      height: auto; 
      display: block; 
      border-radius: 8px; 
    }
    .url-container {
      width: 100%; display: flex; gap: 6px; align-items: center; margin-top: 4px;
    }
    .url-input {
      flex: 1; padding: 6px 8px; background: #0f172a; border: 1px solid #334155;
      color: #38bdf8; font-size: 11px; border-radius: 4px; outline: none; text-overflow: ellipsis;
    }
    .action-btn {
      color: #ffffff; background: #0284c7; border: none; padding: 6px 12px;
      border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none;
      white-space: nowrap;
    }
    .action-btn:hover { background: #0369a1; }
    .card-footer { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <h1>Smart AI Photo Extractor</h1>
  <p class="subtitle">Extracts main property photo & uploads directly to AWS S3</p>

  <input type="file" id="upload" accept="image/*" multiple style="display: none;">
  <button class="upload-btn" onclick="checkAndUpload()">Select Screenshots</button>

  <p id="status">Images select karein.</p>

  <div class="global-actions" id="globalActions">
    <button class="copy-all-btn" onclick="copyAllUrls()">📋 Copy All S3 URLs</button>
  </div>

  <div class="grid-container" id="resultsGrid"></div>

  <script>
    let uploadedUrls = [];

    async function checkAndUpload() {
      document.getElementById('upload').click();
    }

    document.getElementById('upload').addEventListener('change', async (e) => {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      // Render Environment Variable se Key Fetch Karein
      document.getElementById('status').innerText = 'Initializing API Keys...';
      let apiKey = '';
      try {
        const keyRes = await fetch('/api/get-gemini-key');
        const keyData = await keyRes.json();
        apiKey = keyData.apiKey;
      } catch (err) {
        alert("Server Error: Gemini Key fetch nahi ho saki!");
        return;
      }

      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = ""; 
      uploadedUrls = [];
      document.getElementById('globalActions').style.display = 'none';

      for (let i = 0; i < files.length; i++) {
        document.getElementById('status').innerText = `AI Cropping & Uploading image ${i + 1} of ${files.length}...`;
        await processWithGemini(files[i], apiKey, i + 1);
      }

      document.getElementById('status').innerText = `Saari ${files.length} images process ho kar S3 par upload ho chuki hain!`;
      if(uploadedUrls.length > 0) {
        document.getElementById('globalActions').style.display = 'flex';
      }
    });
